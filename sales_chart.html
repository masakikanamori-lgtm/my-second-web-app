<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>果物店 商品別合計販売額</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      background: #f9f9f9;
    }
    h1 { color: #333; margin-bottom: 32px; }
    .chart-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 40px;
    }
    svg text { font-family: sans-serif; }
  </style>
</head>
<body>
  <h1>果物店 商品別合計販売額</h1>
  <div class="chart-container">
    <svg width="500" height="360" viewBox="0 0 500 360">
      <!-- Y軸 -->
      <line x1="60" y1="20" x2="60" y2="280" stroke="#ccc" stroke-width="1"/>
      <!-- X軸 -->
      <line x1="60" y1="280" x2="460" y2="280" stroke="#ccc" stroke-width="1"/>

      <!-- Y軸目盛り (最大8000) -->
      <text x="50" y="284" text-anchor="end" font-size="12" fill="#888">0</text>
      <line x1="58" y1="280" x2="460" y2="280" stroke="#eee" stroke-width="1"/>

      <text x="50" y="214" text-anchor="end" font-size="12" fill="#888">2,000</text>
      <line x1="60" y1="210" x2="460" y2="210" stroke="#eee" stroke-width="1"/>

      <text x="50" y="144" text-anchor="end" font-size="12" fill="#888">4,000</text>
      <line x1="60" y1="140" x2="460" y2="140" stroke="#eee" stroke-width="1"/>

      <text x="50" y="74" text-anchor="end" font-size="12" fill="#888">6,000</text>
      <line x1="60" y1="70" x2="460" y2="70" stroke="#eee" stroke-width="1"/>

      <!-- いちご: 6800 → 高さ = 6800/8000 * 260 = 220.75 -->
      <rect x="90" y="59" width="90" height="221" fill="rgba(231,76,60,0.8)" rx="4"/>
      <text x="135" y="52" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">¥6,800</text>
      <text x="135" y="308" text-anchor="middle" font-size="14" fill="#333">いちご</text>

      <!-- バナナ: 2400 → 高さ = 2400/8000 * 260 = 78 -->
      <rect x="205" y="202" width="90" height="78" fill="rgba(241,196,15,0.8)" rx="4"/>
      <text x="250" y="195" text-anchor="middle" font-size="13" fill="#d4ac0d" font-weight="bold">¥2,400</text>
      <text x="250" y="308" text-anchor="middle" font-size="14" fill="#333">バナナ</text>

      <!-- りんご: 6150 → 高さ = 6150/8000 * 260 = 199.875 -->
      <rect x="320" y="80" width="90" height="200" fill="rgba(39,174,96,0.8)" rx="4"/>
      <text x="365" y="73" text-anchor="middle" font-size="13" fill="#1e8449" font-weight="bold">¥6,150</text>
      <text x="365" y="308" text-anchor="middle" font-size="14" fill="#333">りんご</text>

      <!-- Y軸ラベル -->
      <text x="16" y="160" text-anchor="middle" font-size="13" fill="#666"
        transform="rotate(-90,16,160)">販売額（円）</text>
    </svg>
  </div>
</body>
</html>
