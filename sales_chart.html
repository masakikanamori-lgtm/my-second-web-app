<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>果物店 商品別合計販売額</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      background: #f9f9f9;
    }
    h1 { color: #333; }
    .chart-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 32px;
      width: 600px;
    }
  </style>
</head>
<body>
  <h1>果物店 商品別合計販売額</h1>
  <div class="chart-container">
    <canvas id="salesChart"></canvas>
  </div>
  <script>
    // sales.csv のデータを集計した値
    const data = {
      labels: ['いちご', 'バナナ', 'りんご'],
      datasets: [{
        label: '合計販売額（円）',
        data: [6800, 2400, 6150],
        backgroundColor: [
          'rgba(231, 76, 60, 0.8)',
          'rgba(241, 196, 15, 0.8)',
          'rgba(39, 174, 96, 0.8)'
        ],
        borderColor: [
          'rgba(231, 76, 60, 1)',
          'rgba(241, 196, 15, 1)',
          'rgba(39, 174, 96, 1)'
        ],
        borderWidth: 2,
        borderRadius: 6
      }]
    };

    new Chart(document.getElementById('salesChart'), {
      type: 'bar',
      data: data,
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => `¥${ctx.parsed.y.toLocaleString()}`
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              callback: val => `¥${val.toLocaleString()}`
            }
          }
        }
      }
    });
  </script>
</body>
</html>
